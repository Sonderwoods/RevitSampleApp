name: release

# Publishes a GitHub Release (shown on the repository front page) with:
#   Cloudburst_<ver>_x64_en-US.msi / Cloudburst_<ver>_x64-setup.exe  – desktop app (Tauri)
#   Cloudburst-Rhino.zip, Cloudburst-Revit.zip, Cloudburst-Standalone.zip – plug-ins and the standalone panel app
#   cloudburst-<ver>-rh8*-win.yak – Rhino 8 + Grasshopper as a Yak package (Rhino/pack-yak.ps1)
# Trigger: push a tag like v0.1.0, or Actions → release → Run workflow (enter the tag).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Built into the plug-ins (Cloudburst.Net.dll) and the desktop app (Web/js/config.js) for in-app DHM downloads.
      DHM_API_KEY: ${{ secrets.DHM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build plug-ins (engine + Rhino + Grasshopper + Revit + standalone)
        shell: pwsh
        run: ./build.ps1

      - name: Zip plug-ins
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Rhino/* -DestinationPath Cloudburst-Rhino.zip -Force
          Compress-Archive -Path dist/Revit/* -DestinationPath Cloudburst-Revit.zip -Force
          if (Test-Path dist/Standalone) { Compress-Archive -Path dist/Standalone/* -DestinationPath Cloudburst-Standalone.zip -Force }

      - name: Yak package (Rhino Package Manager)
        shell: pwsh
        run: ./Rhino/pack-yak.ps1 -Version "$env:TAG"

      - name: Bundle the Revit and Rhino plug-ins into the setup program
        shell: pwsh
        run: ./Desktop/stage-plugins.ps1

      - name: Built-in DHM API key for the desktop app (Web/js/config.js)
        run: python tools/inject_dhm_key.py

      - name: Build desktop app installers (Tauri)
        working-directory: Desktop/src-tauri
        shell: pwsh
        run: |
          $v = "$env:TAG".TrimStart('v')
          if ($v -match '^\d+\.\d+\.\d+$') {
            $conf = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
            $conf.version = $v
            $conf | ConvertTo-Json -Depth 20 | Set-Content tauri.conf.json
          }
          npx --yes @tauri-apps/cli@2 build

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Cloudburst ${{ env.TAG }}
          generate_release_notes: true
          body: |
            **Cloudburst – rainwater / cloudburst screening** (screening model, not for compliance).

            | Download | What |
            | --- | --- |
            | `Cloudburst_*_x64-setup.exe` | **Everything in one installer, no administrator rights needed**: the desktop app (Windows 10/11), plus the Revit 2026 add-in and the Rhino 8 + Grasshopper plug-in (tick boxes on the first page, on by default for the programs it finds) |
            | `Cloudburst_*_x64_en-US.msi` | Desktop app only, for IT deployment (needs administrator rights) |
            | `cloudburst-*-win.yak` | Rhino 8 + Grasshopper as one package: drag the file into Rhino 8 and restart Rhino. Run `Cloudburst`. |
            | `Cloudburst-Rhino.zip` | Rhino 8 plug-in (.rhp) + Grasshopper components (.gha). Drag the .rhp into Rhino, run `Cloudburst`. |
            | `Cloudburst-Revit.zip` | Revit 2026 add-in. Unzip into `%AppData%\Autodesk\Revit\Addins\2026\` (the .addin file next to the `Cloudburst` folder). |
            | `Cloudburst-Standalone.zip` | The shared panel without CAD (quick test) |

            Real terrain is downloaded with a built-in Datafordeler API key. To use your own, get one free at https://portal.datafordeler.dk/hjem and set the `DHM_API_KEY` environment variable (plug-ins) or paste it in the location picker (desktop/web).
          files: |
            Desktop/src-tauri/target/release/bundle/msi/*.msi
            Desktop/src-tauri/target/release/bundle/nsis/*.exe
            dist/*.yak
            Cloudburst-Rhino.zip
            Cloudburst-Revit.zip
            Cloudburst-Standalone.zip
