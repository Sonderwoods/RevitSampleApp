name: pages

# Publishes Web/ (the static web app + WebAssembly engine) to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions". If this branch is not the default branch, also allow it
# under Settings → Environments → github-pages → Deployment branches.
on:
  push:
    branches: [main, master, claude/peaceful-wozniak-nmclxh]
    paths: ['Web/**', 'tools/inject_dhm_key.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Standard GitHub Pages layout: upload in one job, deploy in the next (the artifact must be registered first).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Built-in DHM API key (secret DHM_API_KEY → Web/js/config.js)
        env:
          DHM_API_KEY: ${{ secrets.DHM_API_KEY }}
        run: python3 tools/inject_dhm_key.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
