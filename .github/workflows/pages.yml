name: pages

# Publishes Web/ (the static web app + WebAssembly engine) to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions". If this branch is not the default branch, also allow it
# under Settings → Environments → github-pages → Deployment branches.
on:
  push:
    branches: [main, master, claude/peaceful-wozniak-nmclxh]
    paths: ['Web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web
      - id: deployment
        uses: actions/deploy-pages@v4
