name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Rust tests (solver validation)
        working-directory: Shared/cloudburst-core
        run: cargo test --release
      - name: Build native engine (Linux, for .NET tests)
        working-directory: Shared/cloudburst-core
        run: cargo build --release
      - name: .NET wrapper tests
        run: dotnet test Shared/Cloudburst.Net.Tests -c Release

  windows-plugins:
    runs-on: windows-latest
    env:
      # Built into Cloudburst.Net.dll (Rhino / Grasshopper / Revit / standalone) for in-app DHM downloads.
      DHM_API_KEY: ${{ secrets.DHM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build package (engine + Rhino + Grasshopper + Revit)
        shell: pwsh
        run: ./build.ps1
      - name: Yak package (Rhino Package Manager)
        shell: pwsh
        run: ./Rhino/pack-yak.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: cloudburst-windows
          path: dist/

  desktop-windows:
    needs: windows-plugins
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cloudburst-windows
          path: dist
      - name: Bundle the Revit and Rhino plug-ins into the setup program
        shell: pwsh
        run: ./Desktop/stage-plugins.ps1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Built-in DHM API key (secret DHM_API_KEY → Web/js/config.js)
        env:
          DHM_API_KEY: ${{ secrets.DHM_API_KEY }}
        run: python tools/inject_dhm_key.py
      - name: Build Tauri desktop app (NSIS + MSI installers)
        working-directory: Desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: cloudburst-desktop-windows
          path: |
            Desktop/src-tauri/target/release/bundle/nsis/*.exe
            Desktop/src-tauri/target/release/bundle/msi/*.msi
            Desktop/src-tauri/target/release/cloudburst-desktop.exe
